[project]
name = "tributary-notebooks"
version = "0.1.0"
description = "Development environment for the tributary analysis notebooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "delta-spark==4.0.1",
  "folium>=0.20.0",
  "marimo[recommended]>=0.18.4",
  "plotly>=6.0.1",
  "polars>=1.0.0",
  "pyarrow>=19.0.1",
  "pyspark==4.0.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# marimo cells: a bare trailing expression renders output, cells end in a bare
# `return`, and each cell re-imports what it uses.
"notebooks/*.py" = ["B018", "E501", "F401", "F811"]
