name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more if they ever need it.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # Detect whether a PR touches anything that affects the build. Docs-only
  # changes skip the expensive jobs (msrv, test, coverage, doc). On push to main
  # and merge_group there is no PR diff, so `code` is 'true' and everything runs.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE_*'
              - '!.gitignore'
              - '!.editorconfig'

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

  # Dangling dependencies (declared in Cargo.toml but never used). No build needed.
  machete:
    name: machete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  # Python lint/format for the bindings and notebooks.
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format
        run: uvx ruff format --check .

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The DataFusion-heavy workspace plus --all-targets builds overrun the
      # runner's ~14GB free disk. Reclaim ~25GB of preinstalled tooling first.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # clippy runs on the pinned toolchain (rust-toolchain.toml) for the best
      # lints; the declared MSRV floor is verified by the `msrv` job.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"
          components: clippy

      # clippy and test share the "ci" key so they reuse one warmed target/; only
      # main writes the cache so parallel PR jobs don't thrash each other's entry.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Build on the declared MSRV floor (workspace rust-version). Bump the
  # toolchain here in lock-step with Cargo.toml's `rust-version`.
  msrv:
    name: msrv
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `+1.95` overrides rust-toolchain.toml, which pins the newer dev toolchain.
      - name: Check on MSRV
        run: cargo +1.95 check --workspace --all-targets --all-features --locked

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # dorny/test-reporter publishes a check run with the parsed JUnit results.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest

      # --profile ci writes target/nextest/ci/junit.xml and runs every test
      # (fail-fast = false) so the report is complete even on failure.
      - name: Test
        run: cargo nextest run --workspace --all-features --locked --profile ci

      # nextest does not run doctests; run them separately. Runs even if
      # nextest failed above.
      - name: Doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --locked --doc

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: nextest results
          path: target/nextest/ci/junit.xml
          reporter: jest-junit

  # Keep the rustdoc build warning-free (broken intra-doc links etc.).
  doc:
    name: doc
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps --locked

  coverage:
    name: coverage
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Pinned rather than floating `nightly` so an upstream regression can't
      # turn main red overnight. Bump deliberately.
      NIGHTLY: nightly-2026-10-31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Coverage builds a second, instrumented copy of the whole tree.
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Doctest coverage needs the unstable `--persist-doctests`, so every
      # coverage step runs on the pinned nightly (`.profraw` is LLVM-versioned,
      # so mixing stable and nightly breaks once their LLVMs diverge).
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Collect coverage
        run: |
          cargo "+$NIGHTLY" llvm-cov --no-report nextest --workspace --all-features --locked
          cargo "+$NIGHTLY" llvm-cov --no-report --doc --workspace --all-features --locked
          cargo "+$NIGHTLY" llvm-cov report --doctests --codecov --output-path codecov.json

      # Never fails CI on a flaky upload; codecov.yml keeps the status
      # informational so it can't block a PR.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: codecov.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single roll-up status to require in branch protection. Skipped jobs (from
  # docs-only path filtering) count as a pass; anything else that isn't success
  # fails the gate.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [fmt, machete, ruff, clippy, msrv, test, doc, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required jobs succeeded or were skipped
        env:
          RESULTS: >-
            fmt:${{ needs.fmt.result }}
            machete:${{ needs.machete.result }}
            ruff:${{ needs.ruff.result }}
            clippy:${{ needs.clippy.result }}
            msrv:${{ needs.msrv.result }}
            test:${{ needs.test.result }}
            doc:${{ needs.doc.result }}
            coverage:${{ needs.coverage.result }}
        run: |
          for r in $RESULTS; do
            name="${r%%:*}"; result="${r##*:}"
            echo "$name -> $result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::required job '$name' did not succeed ($result)"
              exit 1
            fi
          done
          echo "All required jobs passed (or were skipped)."
