# Coverage is reported but never blocks a PR. Both project and patch statuses
# are informational; tighten (drop `informational`, add a `target`) once a
# baseline is trusted.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "**/examples/**"
  - "**/tests/**"
  - "**/benches/**"

codecov:
  require_ci_to_pass: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
