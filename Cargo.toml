[workspace]
resolver = "2"
members = ["crates/*", "python/"]

[workspace.package]
version = "0.0.1"
authors = ["Robert Pack <robstar.pack@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# internal crates
sim-artifacts = { path = "crates/sim-artifacts" }
sim-core = { path = "crates/sim-core" }
sim-events = { path = "crates/sim-events" }
sim-geo = { path = "crates/sim-geo" }
sim-kitchen = { path = "crates/sim-kitchen" }
sim-logistics = { path = "crates/sim-logistics" }
sim-telemetry = { path = "crates/sim-telemetry" }
sim-validate = { path = "crates/sim-validate" }

# general
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = { version = "6" }
futures = { version = "0.3" }
humantime = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = { version = "2" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde"] }

# randomness
rand = { version = "0.10" }
rand_distr = { version = "0.6" }

# arrow
arrow = { version = "59" }
parquet = { version = "59" }

# datafusion
datafusion = { version = "55" }

# geospatial
fast_paths = { version = "1.0.0" }
geo = { version = "0.33" }
geo-types = { version = "0.7.20" }
h3o = { version = "0.11" }

# cli / tui
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30" }

# observability
opentelemetry = { version = "0.33" }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33" }
tracing = { version = "0.1", features = ["log"] }
tracing-opentelemetry = { version = "0.34" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# python
pyo3 = { version = "0.30" }

# dev / test
approx = { version = "0.5.1" }
criterion = { version = "0.8" }
tempfile = { version = "3.14" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for a debugger: `cargo build --profile debugging`
# (builds into target/debugging/, separate from the dev artifacts).
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[workspace.metadata.typos]
files.extend-exclude = ["crates/cli/assets/"]

# These are not misspellings:
#   - "Noe": Noe Valley, a San Francisco neighborhood used in test fixtures.
#   - "ratatui": the TUI crate.
#   - hex span IDs: OpenTelemetry example trace/span IDs in docs.
[workspace.metadata.typos.default.extend-words]
Noe = "Noe"
ratatui = "ratatui"

[workspace.metadata.typos.default.extend-identifiers]
"00f067aa0ba902b7" = "00f067aa0ba902b7"
"00f067aa0ba902b6" = "00f067aa0ba902b6"
