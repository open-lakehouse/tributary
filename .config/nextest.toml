# nextest configuration. See https://nexte.st/docs/configuration/

[profile.ci]
# Surface flakiness as failures rather than masking it with reruns.
retries = 0
# Run every test and report each failure instead of stopping at the first, so
# the JUnit report is complete.
fail-fast = false
# Quieter on stdout (the JUnit report and the test-reporter check carry the
# detail); show output for failures so logs stay actionable.
failure-output = "immediate-final"
status-level = "fail"

[profile.ci.junit]
# Emitted to target/nextest/ci/junit.xml; consumed by dorny/test-reporter.
path = "junit.xml"
